services:
  - type: web
    name: compliance-sentinel
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # OpenAI-compatible provider for the Render deployment. Local Ollama is
      # not reachable from Render; set these values in the Render dashboard.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: STATUS_CONTEXT
        value: Compliance Sentinel
      - key: LOG_LEVEL
        value: INFO
